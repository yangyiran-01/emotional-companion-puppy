<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">PawPal current system architecture</title><desc id="desc">One React browser application and one Express server. Safety bypasses normal replies. Demo text is simulated; the OpenAI adapter is implemented but live validation remains planned.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#85729e"/></marker></defs>
<style>text{font-family:Inter,Arial,sans-serif;fill:#40364d} .h{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.tiny{font-size:14px}.box{fill:#fff9fd;stroke:#baa2da;stroke-width:2}.line{fill:none;stroke:#85729e;stroke-width:2;marker-end:url(#arrow)}.return{stroke-dasharray:7 6}</style>
<rect width="1440" height="1040" fill="#faf5ff"/><text x="48" y="58" class="h">PawPal · Current implementation</text><text x="48" y="88" class="small">2026-11-17 · Code reflects the running Demo · User acceptance pending</text>
<rect x="40" y="120" width="1360" height="242" rx="24" fill="#efe6fb" stroke="#c8b6e6"/>
<text x="64" y="155" class="label">BROWSER · React · tab memory only</text>
<rect x="72" y="187" width="330" height="110" rx="16" class="box"/><text x="94" y="218" class="label">Frontend UI</text><text x="94" y="246" class="small">Chat, input, loading, error, cards</text><text x="94" y="275" class="tiny">Implemented · src/App.tsx</text>
<rect x="548" y="187" width="350" height="110" rx="16" class="box"/><text x="570" y="218" class="label">Conversation Manager</text><text x="570" y="246" class="small">Context, retry, mode, choice</text><text x="570" y="275" class="tiny">Implemented · useConversation.ts</text>
<rect x="1038" y="187" width="330" height="110" rx="16" class="box"/><text x="1060" y="218" class="label">Pet State Controller</text><text x="1060" y="246" class="small">Shared SVG + four expressions</text><text x="1060" y="275" class="tiny">Implemented · Pet.tsx + CSS</text>
<path d="M402 232H548" class="line"/><text x="415" y="218" class="tiny">Text / decision</text><path d="M898 232H1038" class="line"/><text x="920" y="218" class="tiny">Emotion</text>
<text x="72" y="326" class="small">Accept / Not now: local feedback only</text><text x="72" y="349" class="tiny">No external social operation</text>
<path d="M720 297V403" class="line"/><text x="739" y="388" class="tiny">POST /api/chat · current message + ≤12 recent messages + mode + choice</text>
<rect x="40" y="414" width="1360" height="472" rx="24" fill="#fff2f9" stroke="#ebc2dd"/>
<text x="64" y="451" class="label">SERVER · One Express process · no chat database or content logs</text>
<rect x="488" y="474" width="464" height="72" rx="14" class="box"/><text x="511" y="502" class="label">Validation + Safety routing · Implemented</text><text x="511" y="529" class="tiny">Schema, size, origin, rate limit; current + recent risk cues</text>
<path d="M488 510H352V596" class="line"/><text x="210" y="565" class="tiny">Safety signal</text>
<rect x="72" y="596" width="330" height="110" rx="16" class="box"/><text x="94" y="629" class="label">Fixed safety guidance</text><text x="94" y="657" class="small">No ordinary social card / model</text><text x="94" y="684" class="tiny">Implemented · conversation.ts</text>
<path d="M720 546V596" class="line"/><text x="739" y="577" class="tiny">Normal route</text>
