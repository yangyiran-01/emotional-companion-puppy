<path d="M898 650H1038" class="line"/><text x="918" y="633" class="tiny">Cues</text>
<rect x="1038" y="596" width="330" height="110" rx="16" class="box"/><text x="1060" y="629" class="label">Social Suggestion Logic</text><text x="1060" y="657" class="small">Loneliness + context + choice</text><text x="1060" y="684" class="tiny">Implemented · social.ts</text>
