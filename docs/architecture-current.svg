<rect x="1010" y="916" width="358" height="88" rx="16" fill="#e9ddff" stroke="#aa8cdd"/><text x="1032" y="945" class="label">OpenAI Responses API</text><text x="1032" y="973" class="tiny">Adapter Implemented · live test Planned</text>
